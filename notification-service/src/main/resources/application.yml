server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USER:bidding}
    password: ${DB_PASSWORD:bidding}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

notification:
  from-address: ${MAIL_FROM:bidding@retailer.example}
  bidding-portal-url: ${BIDDING_PORTAL_URL:http://localhost:8080}
  vendor-service-url: ${VENDOR_SERVICE_URL:http://localhost:8081}
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      enabled: false
