server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: auction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auction_db}
    username: ${DB_USER:bidding}
    password: ${DB_PASSWORD:bidding}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true

auction:
  window-duration: ${AUCTION_WINDOW_DURATION:PT1H}
  closer-interval: PT5S
  outbox-poll-interval: PT1S
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8082}
  vendor-service-url: ${VENDOR_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
