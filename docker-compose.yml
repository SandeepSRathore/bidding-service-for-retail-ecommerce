# Usage:
#   mvn package -DskipTests
#   docker compose up -d --build
# Shorter bidding windows for a demo:  AUCTION_WINDOW_DURATION=PT2M docker compose up -d --build

x-service-env: &service-env
  DB_USER: bidding
  DB_PASSWORD: bidding
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  VENDOR_SERVICE_URL: http://vendor-service:8081
  ORDER_SERVICE_URL: http://order-service:8082
  AUCTION_SERVICE_URL: http://auction-service:8083

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bidding
      POSTGRES_PASSWORD: bidding
    ports: ["5432:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidding"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI: http://localhost:8025
      - "1025:1025"   # SMTP

  vendor-service:
    build: { context: ., args: { MODULE: vendor-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/vendor_db
    depends_on: *infra-ready

  order-service:
    build: { context: ., args: { MODULE: order-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
    depends_on: *infra-ready

  auction-service:
    build: { context: ., args: { MODULE: auction-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/auction_db
      AUCTION_WINDOW_DURATION: ${AUCTION_WINDOW_DURATION:-PT1H}
    depends_on: *infra-ready

  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      BIDDING_PORTAL_URL: http://localhost:8080
    depends_on:
      <<: *infra-ready
      mailpit:
        condition: service_started

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    environment:
      <<: *service-env
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      GATEWAY_DEV_TOKEN_ENABLED: "true"   # local stack only: enables /auth/dev-token
    ports: ["8080:8080"]
    depends_on:
      - vendor-service
      - order-service
      - auction-service

volumes:
  pgdata:
