server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: vendor-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vendor_db}
    username: ${DB_USER:bidding}
    password: ${DB_PASSWORD:bidding}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
